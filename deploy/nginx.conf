server {
    listen 80;
    server_name metallink.cm www.metallink.cm;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name metallink.cm www.metallink.cm;
    # certificats installes par certbot
    ssl_certificate     /etc/letsencrypt/live/metallink.cm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metallink.cm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;

    location /static/ { alias /srv/metallink/staticfiles/; expires 30d; }
    location / {
        proxy_pass http://unix:/run/metallink.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
